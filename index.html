<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duck Pond</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1>🦆 Duck Pond</h1>
  <button id="drawerToggle" aria-expanded="false" aria-controls="drawer">Tasks &amp; settings</button>
</header>

<main id="stage">
  <canvas id="sceneCanvas"></canvas>
  <div id="ducks"></div>
  <p id="emptyHint" hidden>The pond is empty. Add a task below and a duck will bring it in.</p>

  <div id="revealCard" class="card" hidden>
    <p class="card-label">Your task</p>
    <p id="revealText" role="status" aria-live="polite"></p>
    <div class="card-actions">
      <button id="btnDone">✓ Done</button>
      <button id="btnNotNow">↩ Not now</button>
    </div>
  </div>
</main>

<form id="addForm" autocomplete="off">
  <label class="visually-hidden" for="addInput">Add a task</label>
  <input id="addInput" type="text" maxlength="100" placeholder="Add a task…">
  <button type="submit">Add</button>
</form>

<aside id="drawer" hidden>
  <section>
    <h2>Tasks</h2>
    <p class="drawer-note">This list shows every task, including the ones ducks are hiding.</p>
    <ul id="taskList"></ul>
  </section>

  <section>
    <h2>Settings</h2>
    <label>Ducks in the pond
      <input id="capacityInput" type="range" min="4" max="20" step="1">
      <output id="capacityVal"></output>
    </label>
    <label>On dismiss
      <select id="dismissSelect">
        <option value="done">Treat as done</option>
        <option value="pile">Put back in the pile</option>
      </select>
    </label>
    <label>Volume
      <input id="volumeInput" type="range" min="0" max="100" step="1">
      <output id="volumeVal"></output>
    </label>
  </section>

  <section>
    <h2>Done</h2>
    <ul id="historyList"></ul>
  </section>
</aside>

<script src="js/state.js"></script>
<script src="js/sprites.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/pond.js"></script>
<script src="js/app.js"></script>
</body>
</html>
